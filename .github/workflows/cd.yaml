# # CD: deploys everything, with no manual step. Runs on every push to main, and only if CI (ci.yml) passed.
# #
# #   ci        the whole CI workflow, called as a job. Every job below needs it.
# #   layer1    AWS-only Terraform (network, EKS, RDS, ASGs, buckets...) on a GitHub-hosted runner.
# #   runner    picks the in-VPC runner: ARC once it exists, otherwise starts the small EC2 bootstrap runner.
# #   deploy    on that in-VPC runner (the Kubernetes API and the database are private):
# #               platform Terraform -> Argo CD + sync waves -> database migrations -> ETL release -> checks
# #   finish    once ARC works, turns the EC2 bootstrap runner off.
# #
# # Any failed step stops the run; its logs and an error summary are uploaded as the "failure-logs-*" artifact.
