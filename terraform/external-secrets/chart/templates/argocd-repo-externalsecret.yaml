{{- if .Values.argocdRepoSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.argocdRepoSecret.name }}
  namespace: {{ .Values.argocdRepoSecret.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.storeName }}
  target:
    name: {{ .Values.argocdRepoSecret.name }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
  dataFrom:
    - extract:
        key: {{ .Values.argocdRepoSecret.remoteKey }}
{{- end }}