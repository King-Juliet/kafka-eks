apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # Node IAM role created by the karpenter Terraform module. Karpenter builds the instance profile itself.
  role: {{ required "nodeRoleName is required" .Values.nodeRoleName | quote }}

  amiSelectorTerms:
    - alias: {{ .Values.amiAlias | quote }}

  # Discovered by tag - set by Terraform on the node-tier subnets and the node security group.
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ required "clusterName is required" .Values.clusterName | quote }}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}

  associatePublicIPAddress: {{ .Values.associatePublicIPAddress }}

  # IMDSv2 only; hop limit 1 so pods cannot reach the node's credentials.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: {{ printf "%dGi" (int .Values.rootVolumeGiB) }}
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    Project: {{ .Values.clusterName | quote }}
    ManagedBy: karpenter