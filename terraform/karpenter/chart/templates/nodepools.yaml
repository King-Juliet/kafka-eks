{{- range $name, $p := .Values.pools }}
{{- if $p.enabled }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ $name }}
spec:
  template:
    metadata:
      labels:
        workload: {{ $p.workload | quote }}
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson $p.capacityTypes }}
        - key: node.kubernetes.io/instance-type
          operator: In
          values: {{ toJson $p.instanceTypes }}
      {{- with $p.taint }}
      taints:
        - key: {{ .key | quote }}
          value: {{ .value | quote }}
          effect: {{ .effect }}
      {{- end }}
      expireAfter: {{ $p.expireAfter }}
  disruption:
    consolidationPolicy: {{ $p.disruption.consolidationPolicy }}
    consolidateAfter: {{ $p.disruption.consolidateAfter }}
    budgets:
      {{- range $p.disruption.budgets }}
      - nodes: {{ .nodes | quote }}
      {{- end }}
  limits:
    cpu: {{ $p.cpuLimit | quote }}
{{- end }}
{{- end }}