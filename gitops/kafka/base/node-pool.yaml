# Brokers: they store and serve the actual data. THIS is the number you change to scale Kafka.
#   Scale out: raise `replicas`, commit. Karpenter adds a node, Strimzi adds the broker, Cruise Control
#              (autoRebalance add-brokers) moves partitions onto it.
#   Scale in : lower `replicas`, commit. Cruise Control drains the highest-numbered broker first.
# They run on their own Karpenter pool (kafka-brokers).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: broker
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-test
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi # ASSUMPTION: small test volume; expandable online (StorageClass allows it)
        class: kafka-gp3
        deleteClaim: false
        kraftMetadata: shared
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits: { memory: 4Gi }
  jvmOptions:
    -Xms: 2g
    -Xmx: 2g
  template:
    pod:
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      priorityClassName: kafka-critical
      terminationGracePeriodSeconds: 120
      tolerations:
        - key: dedicated
          operator: Equal
          value: kafka-broker
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values: ["kafka-broker"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  strimzi.io/cluster: kafka-test
                  strimzi.io/pool-name: broker
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: kafka-test
              strimzi.io/pool-name: broker