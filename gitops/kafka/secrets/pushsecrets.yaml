---
# The cluster CA certificate clients must trust (public certificate, not a secret key).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-cluster-ca
  namespace: kafka
spec:
  refreshInterval: 10m
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: aws-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: kafka-test-cluster-ca-cert
  data:
    - match:
        secretKey: ca.crt
        remoteRef:
          remoteKey: /kafka/cluster/ca-crt