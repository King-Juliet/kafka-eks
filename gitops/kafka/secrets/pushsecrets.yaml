# External Secrets "PushSecret" = Kubernetes Secret -> AWS Secrets Manager (the reverse of the usual direction).
# Why: producer/consumer apps outside the cluster (e.g. ASGs) cannot read Kubernetes Secrets.
# The ESO role (terraform/external-secrets) may only write /kafka/* secrets.
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-producer-app
  namespace: kafka
spec:
  refreshInterval: 10m
  updatePolicy: Replace
  deletionPolicy: None # keep the AWS secret even if the Kubernetes Secret disappears
  secretStoreRefs:
    - name: aws-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: producer-app
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /kafka/clients/producer-app
---
