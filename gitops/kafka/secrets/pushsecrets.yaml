---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-producer-app
  namespace: kafka
spec:
  refreshInterval: 10m
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: aws-secrets-manager
      kind: ClusterSecretStore
  selector:
    secret:
      name: producer-app
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /kafka/clients/producer-app
      metadata:
        apiVersion: kubernetes.external-secrets.io/v1alpha1
        kind: PushSecretMetadata
        spec:
          secretPushFormat: string
