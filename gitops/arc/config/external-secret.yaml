# The GitHub token the runner controller registers runners with. It lives in AWS Secrets Manager
# (/github/runner-auth, JSON key github_token, typed in once by a human) and External Secrets copies it here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-config
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: arc-github-config
    creationPolicy: Owner
  data:
    - secretKey: github_token
      remoteRef:
        key: /github/runner-auth
        property: github_token