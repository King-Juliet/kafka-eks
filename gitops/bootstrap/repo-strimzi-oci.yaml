# Applied ONCE by hand: registers the Strimzi OCI Helm registry with Argo CD.
# (Argo CD needs this because the chart is pulled from an OCI registry, not a classic Helm repo.)
apiVersion: v1
kind: Secret
metadata:
  name: repo-strimzi-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: strimzi
  type: helm
  url: quay.io/strimzi-helm
  enableOCI: "true"