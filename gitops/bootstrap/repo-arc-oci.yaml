# Applied by scripts/bootstrap-gitops.sh: registers the ARC OCI Helm registry with Argo CD
# (same reason as repo-strimzi-oci.yaml: the charts come from an OCI registry, not a classic Helm repo).
apiVersion: v1
kind: Secret
metadata:
  name: repo-arc-oci
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: arc
  type: helm
  url: ghcr.io/actions/actions-runner-controller-charts
  enableOCI: "true"