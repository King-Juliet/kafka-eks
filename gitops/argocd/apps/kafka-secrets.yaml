# Wave 2: External Secrets PushSecrets - copy the generated Kafka credentials and cluster CA into
# AWS Secrets Manager so producer/consumer apps outside the cluster (e.g. ASGs) can read them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: kafka
  source:
    repoURL: https://github.com/YOUR-ORG/YOUR-REPO.git
    targetRevision: main
    path: gitops/kafka/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 20
      backoff: { duration: 30s, factor: 2, maxDuration: 15m }