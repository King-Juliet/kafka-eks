# Wave 0: the Strimzi operator (installs the Kafka CRDs and the controller that acts on them).
# The chart and every image come from YOUR ECR (a pull-through cache of quay.io), not from quay.io directly. Pinned to 1.3.1.
# ACCOUNT_ID is your 12-digit AWS account id; `bash scripts/account_id.sh set <id>` replaces it everywhere (README step 4).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: kafka
  source:
    repoURL: 992382810653.dkr.ecr.us-east-1.amazonaws.com/quay/strimzi-helm
    chart: strimzi-kafka-operator
    targetRevision: 1.3.1
    helm:
      releaseName: strimzi
      valuesObject:
        # Every image the operator starts (Kafka, entity operator, exporter...) comes from your ECR, not quay.io.
        defaultImageRegistry: 992382810653.dkr.ecr.us-east-1.amazonaws.com/quay
        replicas: 1 # ASSUMPTION: 1 for a test. Production: 2 (leader election is already on).
        watchNamespaces:
          - kafka
        generateNetworkPolicy: true
        generatePodDisruptionBudget: true
        leaderElection:
          enable: true
        # Platform controllers live on the small tainted system node group.
        nodeSelector:
          workload: system
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
        resources:
          requests: { cpu: 200m, memory: 384Mi }
          limits: { memory: 384Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # the Kafka CRDs are too big for client-side apply
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 10m }